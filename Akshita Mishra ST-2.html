<!DOCTYPE html>
<html>
<head>
<title>Student Profile cards</title>
<style>
.container{
display: flex;
flex-direction: row;
justify-content: center;
align-items: center;
gap: 20px;
flex-wrap: wrap;
}
.card{
background-color: pink;
border-radius: 8px;
width: 220px;
text-align: center;
padding: 16px;
}
body{
margin: 20px;
background-color: white;
}
h2{
text-align: center;
}
.avatar{
height: 70px;
width: 70px;
border-radius: 50%;
color: red;
justify-content: center;
display: flex;
align-items: center;
margin: 0 auto 12px;
font-size: 20px;
}
.name{
font-size: 18px;
font-weight: bold;
}
.detail{
font-size: 14px;
color: black;
}
</style>
</head>
<body>
<h2>Student Profile Cards</h2>
<div class="container">
<div class="card">
<div class="avatar">VK</div>
<div class="name">Virat Kohli</div>
<div class="detail">BTECH CSE</div>
<div class="detail">Section:1</div>
<div class="detail">Roll No.:1008</div>
</div>
<div class="card">
<div class="avatar">SM</div>
<div class="name">Smriti Mandhana</div>
<div class="detail">BTECH CSE</div>
<div class="detail">Section:1</div>
<div class="detail">Roll No.:1007</div>
</div>
<div class="card">
<div class="avatar">AP</div>
<div class="name">Akshar Patel</div>
<div class="detail">BTECH CSE</div>
<div class="detail">Section:1</div>
<div class="detail">Roll No.:1009</div>
</div>
</div>
</body>
</html>
