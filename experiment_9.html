<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment-9</title>
    <style>
        body{
            text-align: center;
        }
        h1{
            margin-bottom: 20px;
        }
        img{
            width:100px;
            height:100px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .grid{
            display: flex;
            gap: 10px;
            grid-template-rows:repeat(4,1fr);
        }
        .card1{
           background-color: #ffe555;
           border: 7px solid black;
        }
        .card2{
            background-color: #F9F8F6;
            border: 7px solid black;
        }
        .card3{
            background-color: #F3F2EC;
            border: 7px solid black;
        }
        .card4{
            background-color: #D3DAD9;
            border: 7px solid black;
        }
    </style>
</head>
<body>
    <h1>Responsive Product Grid</h1>
    <div class="grid">
        <div class="card1">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?fm=jpg&q=60&w=3000&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8cHJvZHVjdHxlbnwwfHwwfHx8MA%3D%3D" alt="Product-1">
            <h2> Product-1 </h2>
            <p> High-quality Headphones with great features</p>
            <p class="price">₹1199</p>
        </div>
        <div class="card2">
            <img src="https://png.pngtree.com/png-vector/20210602/ourmid/pngtree-3d-beauty-cosmetics-product-design-png-image_3350323.jpg" alt="Product-2">
            <h2> Product-2 </h2>
            <p> Best Beauty Products Suitable for all skin types</p>
            <p class="price">₹1599</p>
        </div>
        <div class="card3">
            <img src="https://5.imimg.com/data5/ANDROID/Default/2023/7/326598386/TM/JD/NK/189033354/product-jpeg-500x500.jpg" alt="Product-3">
            <h2>Product-3</h2>
            <p>Stylish Hand-Bag</p>
            <p class="price">₹999</p>
        </div>
        <div class="card4">
            <img src="https://images.pexels.com/photos/3766111/pexels-photo-3766111.jpeg?auto=compress&cs=tinysrgb&dpr=1&w=500" alt="Product-4">
            <h2> Product-4 </h2>
            <p> Best Titan Watch for girls </p>
            <p class="price">₹3999</p>
        </div>

    </div>
    
</body>
</html>
