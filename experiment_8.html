<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment-8</title>
    <style>
        body{
             font-family: Arial,sans-serif;
             margin: 20px;
             background-color: #f9f9f9;
        }
        h2{
            text-align: center;
        }
        .container{
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap:20px;
            flex-wrap: wrap;
        }
        .card{
            background-color: pink;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgb(0,0,0,0,0,1);
            width: 220px;
            text-align: center;
            padding: 16px;
        }
        .avatar{
            width: 70px;
            height: 70px;
            background-color: blue;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            margin: 0 auto 12px;
        }
        .name{
            font-weight: bold;
            font-size: 18px;
        }
        .detail{
            font-size: 14px;
            color: #555;
            margin: 2px 0;
        }
    </style>
</head>
<body>
    <h2>Student Profile Cards</h2>
    <div class="container">
        <div class="card">
            <div class="avatar">VK</div>
            <div class="name">Virat Kohli</div>
            <div class="detail">B.TECH-CSE</div>
            <div class="detail">Roll No.: 21CS1008</div>
            <div class="detail">Ist Year</div>
        </div>
        <div class="card">
            <div class="avatar">SM</div>
            <div class="name">Smriti Mandhana</div>
            <div class="detail">B.TECH-CSE</div>
            <div class="detail">Roll No.: 21CS1010</div>
            <div class="detail">1st Year</div>
        </div>
        <div class="card">
            <div class="avatar">AP</div>
            <div class="name">Akshar Patel</div>
            <div class="detail">BTECH-CSE</div>
            <div class="detail">Roll No.: 21CS1007</div>
            <div class="detail">1st Year</div>
        </div>
    </div>
    
</body>
</html>
