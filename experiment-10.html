<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Navbar</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: black;
            color: white;
        }
        
        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            padding: 15px 20px;
        }
        .logo{
            font-size: 40px;
            font-weight: bold;
            color: red;
        }
        .nav-links{
            color: white;
            font-size: 20px;
            display: flex;
            list-style: none;
            gap: 20px;
        }
        .nav-links a{
            text-decoration: none;
            color: white;
        }
        .actions a{
            margin-left: 15px;
            color: white;
            font-weight: bold;

        }
        section{
            text-align: center;
            font-size: 30px;
            margin: 20px;
            padding: 100px;
        }
        .two{
            width: 300px;
            height: 50px;
            align-items: center;
            gap: 2px;
            background-color: red;
        }
        .one{
            width: 200px;
            height: 50px;
            background-color: red;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">NETFLIX</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Movies</a></li>
            <li><a href="#">Contact</a></li>
             </ul>
             <div class="actions">
                <a href="#">Sign in</a>
                <a href="#">Login</a>
             </div>
    </nav>
    <section>
        <h1>Unlimited movies,shows and more</h1>
        <h5>Watch anywhere. Cancel anytime</h5>
        <p>Reply to watch? Enter your email to create or restart your membership</p>
        <button class="two">Enter your email address</button>
        <button class="one">Get Started></button>
    </section>
</body>
</html>
